<header class="site-header">
  <a class="brand" routerLink="/" aria-label="Memento, retour à l'accueil">Memento<span class="mark">.</span></a>
  <nav aria-label="Navigation principale">
    <a routerLink="/lecon" routerLinkActive="current" ariaCurrentWhenActive="page">Nouvelle leçon</a>
    @if (hasLesson()) {
      <a routerLink="/seance" routerLinkActive="current" ariaCurrentWhenActive="page">Séance</a>
      <a routerLink="/plan" routerLinkActive="current" ariaCurrentWhenActive="page">Mon plan</a>
    }
    @if (account(); as a) {
      <a routerLink="/mes-lecons" routerLinkActive="current" ariaCurrentWhenActive="page">Mes leçons</a>
      <span class="who" title="Connecté">{{ a.email }}</span>
      <button type="button" class="out" (click)="logout()">Déconnexion</button>
    } @else {
      <a routerLink="/connexion" routerLinkActive="current" ariaCurrentWhenActive="page">Se connecter</a>
    }
  </nav>
</header>
