server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # En-têtes de protection (OWASP). 'unsafe-inline' sur les styles : Angular insère du CSS critique.
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Résolution DNS à la demande : nginx démarre même si le backend n'est pas encore (ou plus) disponible.
  resolver 127.0.0.11 valid=10s;

  # API et connexion Google / Microsoft (départ et retour OAuth2) : tout passe par le backend.
  location ~ ^/(api|oauth2|login/oauth2)/ {
    set $api http://backend:8080;
    proxy_pass $api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
